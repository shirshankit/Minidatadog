name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: minidatadog
          POSTGRES_PASSWORD: minidatadog
          POSTGRES_DB: minidatadog
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run automated test suite
        env:
          DATABASE_URL: postgresql://minidatadog:minidatadog@localhost:5432/minidatadog
          SERVICE_NAME: demo-service
          TELEMETRY_RETENTION_DAYS: "5"
        run: |
          python -m pytest backend/tests -v

  docker:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Build Docker container image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: minidatadog:ci-check
