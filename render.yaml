services:
  - type: web
    name: minidatadog
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: minidatadog-db
          property: connectionString
      - key: SERVICE_NAME
        value: demo-service
      - key: TELEMETRY_RETENTION_DAYS
        value: "5"
      - key: FORCE_HTTPS
        value: "true"
      - key: ALERT_WEBHOOK_URL
        sync: false
      - key: ALERT_COOLDOWN_SECONDS
        value: "900"
databases:
  - name: minidatadog-db
    plan: free
    databaseName: minidatadog
    user: minidatadog
