services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: minidatadog
      POSTGRES_USER: minidatadog
      POSTGRES_PASSWORD: minidatadog
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minidatadog -d minidatadog"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
